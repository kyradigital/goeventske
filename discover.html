<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Discover events — Go Events Kenya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-head" id="siteHead"></header>

<!-- a dark band to open on: the listing is the product, so it gets a stage -->
<section class="browse-top">
  <div class="wrap">
    <span class="live-now">Live right now</span>
    <h1 class="browse-title">What's on<span class="dot">.</span></h1>
    <p class="browse-sub">Every event on Go Events Kenya, from every organiser — one checkout, one ticket, straight to your phone.</p>
    <div class="search-bar big">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="Event, venue or town…" autocomplete="off">
    </div>
  </div>
</section>

<!-- the filters follow you down the page -->
<div class="filter-bar" id="filterBar">
  <div class="wrap filter-row">
    <div class="chip-row" id="cats"></div>
    <span class="result-count" id="count"></span>
  </div>
</div>

<section class="page browse-page">
  <div class="wrap">
    <div id="grid"><div class="grid-skeleton">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div></div>
  </div>
</section>

<footer class="site-foot" id="siteFoot"></footer>

<script src="assets/js/vendor/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/discover.js"></script>
</body>
</html>
